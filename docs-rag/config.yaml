# Embedding — canonical triple; every KB MUST share this space.
# nomic-embed-text is present on local Ollama (:11434). A per-KB dimension
# guard hard-fails on mismatch, so do not mix models.
embedding:
  model: nomic-embed-text
  dimension: 768
  backend: ollama

# Default (v1) database — the `primary` KB points at this same logical DB.
database:
  host: postgres
  port: 5432
  name: ragdb
  user: raguser
  password_env: POSTGRES_PASSWORD

cache:
  url: "redis://redis:6379/0"

kb_defaults:
  host: postgres
  port: 5432
  user: raguser
  password_env: POSTGRES_PASSWORD

# ── Knowledge bases ───────────────────────────────────────────────────────────
# `database:` is REQUIRED on every KB. app/registry.py:35-45 has a
# default_kb_database() that would derive ragdb_<name>, but config_manager.py:268
# does NOT apply it and hard-fails at startup:
#     ValueError: KB 'cec_320' has no database name: set 'database:' in its
#     knowledge_bases entry
# Observed here 2026-09-04 — the api restart-looped until every KB had one.
# The database itself IS created automatically at API startup — do not
# pre-create it.
#
# `primary` is special: it must keep database: ragdb, and
# `ingest_kb.py --kb primary` is REFUSED (scripts/ingest_kb.py:63-67).
# Ingest it with the v1 flow (`rag ingest`); every other KB uses
# `rag ingest-kb --kb <name>`.
#
# Chunk estimates are from a full survey of the repo, 2026-09-04.
knowledge_bases:

  primary:                       # everything; the kb-less default
    type: postgres
    database: ragdb
    ingest_dirs:
      - /home/devel/electrical_notes/content
      - /home/devel/electrical_notes/docs-rag/corpus
    extensions: *exts
    exclude: *ex

  # ── Large: 66% of all text ──────────────────────────────────────────────
  cec_320:                       # ~2,140 chunks · Microprocessors
    type: postgres
    database: ragdb_cec_320
    ingest_dirs:
      - /home/devel/electrical_notes/content/cec_320
      - /home/devel/electrical_notes/docs-rag/corpus/cec_320
    extensions: *exts
    exclude: *ex

  syse_301:                      # ~1,970 chunks · 100% PDF, zero md/tex.
    type: postgres               # Three reference handbooks (NASA SE 360p,
    database: ragdb_syse_301     # INCOSE 370p, DoD 240p) — long generic prose,
    ingest_dirs:
      - /home/devel/electrical_notes/content/syse_301   # retrieval behaves
    extensions: *exts            # differently from course notes.
    exclude: *ex

  cec_315:                       # ~1,590 chunks · Signals & Systems
    type: postgres
    database: ragdb_cec_315
    ingest_dirs:
      - /home/devel/electrical_notes/content/cec_315
      - /home/devel/electrical_notes/docs-rag/corpus/cec_315
    extensions: *exts
    exclude: *ex

  # ── Mid ─────────────────────────────────────────────────────────────────
  stat_412:                      # ~550 chunks · 203 .tex, the most LaTeX-heavy
    type: postgres
    database: ragdb_stat_412
    ingest_dirs:
      - /home/devel/electrical_notes/content/stat_412
      - /home/devel/electrical_notes/docs-rag/corpus/stat_412
    extensions: *exts
    exclude: *ex

  ps160:                         # ~540 chunks · ⚠ 54% of PDFs are image-only,
    type: postgres               # incl. the whole 202 MB scanned textbook.
    database: ragdb_ps160        # Needs ocr_handler to be truly useful.
    ingest_dirs:
      - /home/devel/electrical_notes/content/ps160
      - /home/devel/electrical_notes/docs-rag/corpus/ps160
    extensions: *exts
    exclude: *ex

  cec_300:                       # ~400 chunks · ⚠ 48% of PDFs image-only
    type: postgres
    database: ragdb_cec_300
    ingest_dirs:
      - /home/devel/electrical_notes/content/cec_300
      - /home/devel/electrical_notes/docs-rag/corpus/cec_300
    extensions: *exts
    exclude: *ex

  ee_300:                        # ~360 chunks · 100% text-bearing PDFs
    type: postgres
    database: ragdb_ee_300
    ingest_dirs:
      - /home/devel/electrical_notes/content/ee_300
    extensions: *exts
    exclude: *ex

  # ── Small but actively used; a small KB beats dilution ──────────────────
  sys_304:                       # ~240 chunks
    type: postgres
    database: ragdb_sys_304
    ingest_dirs:
      - /home/devel/electrical_notes/content/sys_304
    extensions: *exts
    exclude: *ex

  cesc_420:                      # ~230 chunks · capstone (drone swarm)
    type: postgres
    database: ragdb_cesc_420
    ingest_dirs:
      - /home/devel/electrical_notes/content/cesc_420
