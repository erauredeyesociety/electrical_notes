    exclude: *ex

  cesc_410:                      # ~200 chunks · DSP; ACTIVELY GROWING.
    type: postgres               # Note: senior_design/ holds cesc_510 material,
    database: ragdb_cesc_410     # a small course-boundary leak.
    ingest_dirs:
      - /home/devel/electrical_notes/content/cesc_410
      - /home/devel/electrical_notes/docs-rag/corpus/cesc_410
    extensions: *exts
    exclude: *ex

  ee_302:                        # ~140 chunks
    type: postgres
    database: ragdb_ee_302
    ingest_dirs:
      - /home/devel/electrical_notes/content/ee_302
    extensions: *exts
    exclude: *ex

  ae318:                         # ~120 chunks
    type: postgres
    database: ragdb_ae318
    ingest_dirs:
      - /home/devel/electrical_notes/content/ae318
      - /home/devel/electrical_notes/docs-rag/corpus/ae318
    extensions: *exts
    exclude: *ex

  cpsc_462:                      # ~110 chunks · networks/Wireshark;
    type: postgres               # ACTIVELY GROWING. md_notes/ carries the text
    database: ragdb_cpsc_462     # extracted from its pptx/docx.
    # md_notes/ ONLY, not class_materials/. Every source document there has
    # been extracted to md_notes/, so indexing both returned the same passage
    # twice (verified: a packet-sniffer query returned the .pdf and its .md
    # twin as separate hits). The md is the better copy — it came from the
    # .docx with headings and figures intact.
    # corpus/cpsc_462 carries the hw/exam/qz .tex converted to .md.
    ingest_dirs:
      - /home/devel/electrical_notes/content/cpsc_462/md_notes
      - /home/devel/electrical_notes/docs-rag/corpus/cpsc_462
    extensions: *exts
    exclude: *ex

  cesc_470:                      # Computer Architecture · ACTIVELY STUDIED,
    type: postgres               # quizzes imminent. Promoted out of `misc`.
    database: ragdb_cesc_470
    # md_notes/ (tutorials with worked examples) and pdf_transcripts/ (raw text
    # layer) both indexed: the tutorials answer "how do I do this", the
    # transcripts preserve the instructor's exact wording. The source PDFs are
    # NOT indexed — pdf_transcripts/ already carries their whole text layer, so
    # adding them would return the same passage twice.
    # corpus/cesc_470 carries hw/hw01's worked .tex solutions converted to .md.
    # Without it the entire HW01 answer key is invisible to the KB.
    ingest_dirs:
      - /home/devel/electrical_notes/content/cesc_470/md_notes
      - /home/devel/electrical_notes/content/cesc_470/pdf_transcripts
      - /home/devel/electrical_notes/docs-rag/corpus/cesc_470
    extensions: *exts
    exclude: *ex

