# ══════════════════════════════════════════════════════════════════════════════
# RAG Bootstrap — CONSUMER config.yaml (multi-KB) — electrical_notes
# ══════════════════════════════════════════════════════════════════════════════
# Mounted READ-ONLY into the multi-KB image at /src/config/config.yaml. This
# file is the ONLY source of the knowledge-base list.
#
# ONE KB PER COURSE, so a query routed to a course searches a small index.
# The whole corpus is only ~8,600 chunks, so this is about routing precision
# and latency, not index-size limits.
#
# ── TWO THINGS THAT WILL BITE YOU ─────────────────────────────────────────────
#
# 1. `.tex` HAS NO HANDLER and is dropped SILENTLY (app/ingestion.py:299-320).
#    Listing it logs "Ignoring extensions with no registered handler" and
#    ingests ZERO files while reporting success. Most of this repo is LaTeX.
#    That is why every course KB also points at ../docs-rag/corpus/<course>,
#    where ./prepare_corpus.py has converted .tex -> .md. Run that FIRST:
#        ./prepare_corpus.py
#
# 2. `exclude` BEATS `extensions` (app/ingestion.py:1046-1063). Listing `pdf`
#    while also excluding "*.pdf" yields nothing, silently. Do not copy
#    skytracker's config here — it excludes *.pdf and *.tex on purpose for a
#    Markdown-only corpus.
#
# See FINDINGS.md for the evidence behind both.
# ══════════════════════════════════════════════════════════════════════════════

project_name: electrical-notes

network:
  name: electrical-notes-net
  # Host port derives from RAG_PORT in .env (RAG_PORT_BASE+0).
  port: 10120

# Chunking (whitespace-based approximation). Keep in sync with .env CHUNK_*.
ingestion:
  chunk_size: 256
  chunk_overlap: 50
  # Feeds the v1 engine (ragdb) == the `primary` KB == what the web UI search
  # box reads with no KB selected. Covers everything, so a kb-less search still
  # works across all courses.
  directories:
    - /home/devel/electrical_notes/content
    - /home/devel/electrical_notes/docs-rag/corpus
  extensions: &exts [md, txt, pdf]
  exclude: &ex
    - ".git/"
    - ".venv/"            # cesc_410 lab venv: 5,287 files / 280 MB
    - "venv/"
    - "__pycache__/"
    - ".obsidian/"
    - ".worklogs/"
    - "tmp/"
    - "node_modules/"
    - "public/"
    - "resources/"
    - ".pytest_cache/"
    - "figs/"
    - "overleaf/"        # self-contained Overleaf copies: preamble inlined,
                         # body prose byte-for-byte the parent .tex. 21 files
                         # under cesc_410/ and cesc_470/. Indexing both returns
                         # the same passage twice; the md5 pass cannot catch it
                         # because the inlined preamble makes the bytes differ.
    - "*.zip"             # 33 archives, 119 MB
    - "*.so"
    - "*.png"
    - "*.jpg"
    - "*.npz"
    - "*.npy"
