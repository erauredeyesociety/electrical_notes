[project]
name = "dsp26"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kaleldev", email = "kaleldev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "scipy>=1.18.1",
    "typer>=0.27.2",
]

[project.scripts]
dsp26 = "dsp26:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
